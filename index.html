<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A simple three-question beginner quiz. Test your knowledge and see your score.">
  <title>Quick Quiz | EdBytes Task 4</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="page-shell">
    <section class="quiz-card" aria-labelledby="app-title">
      <p class="eyebrow">EDBYTES · TASK 4</p>
      <h1 id="app-title">Quick Quiz</h1>
      <p class="intro">Answer all three questions and see how you score.</p>
      <div class="progress-row">
        <span id="progress-label">Question 1 of 3</span>
        <span id="progress-count">1 / 3</span>
      </div>
      <div class="progress-track" aria-hidden="true"><div id="progress-fill"></div></div>
      <h2 id="question" aria-live="polite"></h2>
      <div id="answers" class="answers" aria-label="Answer choices"></div>
      <p id="feedback" class="feedback" role="status" aria-live="polite"></p>
      <button id="next" class="next-button" type="button" disabled>Next question</button>
      <section id="result" class="result" hidden aria-live="polite">
        <div class="result-icon" aria-hidden="true">✓</div>
        <h2>Quiz completed!</h2>
        <p id="final-score" class="final-score"></p>
        <p id="result-message"></p>
        <button id="restart" class="next-button" type="button">Try again</button>
      </section>
    </section>
    <footer>Built for EdBytes Full Stack Development · TASK-FSD-03</footer>
  </main>
</body>
</html>
